<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chau's Reading Lab: luyện đọc hiểu tiếng Anh với giải thích đáp án và ôn từ vựng.">
<title>Chau's Reading Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: sticky exam bar on top, one centered card that switches between Warm-up → Test → Results */
/* hihi look: ivory ground, forest-green accent, sunny yellow highlight, ink black, sage & lilac tiles */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#16181D; --muted:#4A4D55; --line:#E6E6E0;
  --brand:#1F4D3A; --brand-soft:#E3EEE7; --coral:#B5651D; --coral-soft:#FBEBD0;
  --hl:#F6D36B; --hl-ink:#4A3B00; --sage:#DCE7DF; --lilac:#E4E2F2; --lilac-ink:#34305A;
  --dark:#16181D; --dark-ink:#FFFFFF; --dark-muted:#C9CBD1;
  --chip:#E3EEE7; --chip-ink:#1F4D3A; --ok:#1F7A4D; --ok-soft:#DDF0E4; --bad:#B4323F; --bad-soft:#FBE4E6;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-sign:"Fraunces",Georgia,serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.blank:focus-visible,.word:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 2px;color:var(--ink)}
.sep{width:1px;height:22px;background:var(--line)}
.title{font-weight:700;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.title svg{flex:none;color:var(--muted)}
.timer{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;padding:6px 14px;border-radius:999px;background:var(--brand-soft);color:var(--brand);display:flex;gap:6px;align-items:center}
.timer.warn{background:var(--coral-soft);color:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qlist-btn{background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:9px 16px;font-weight:700;display:flex;gap:8px;align-items:center}

main{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.code{background:var(--ink);color:var(--surface);font-weight:700;font-size:13px;letter-spacing:.04em;padding:5px 12px;border-radius:8px}
.mark{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.mark[aria-pressed="true"]{background:var(--coral-soft);color:var(--coral);border-color:var(--coral)}
.card-body{padding:22px 18px 26px;display:flex;flex-direction:column;gap:22px}
.instr{font-weight:700;margin:0}

/* Passage + blanks */
.passage{font-size:16px;line-height:2.4;margin:0}
.blank{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:150px;height:30px;margin:0 6px;padding:0 10px;
  border:1.5px solid var(--muted);border-radius:8px;background:var(--surface);font-weight:600;color:var(--chip-ink);transition:.15s;line-height:1}
.blank.filled{background:var(--chip);border-color:var(--chip-ink);cursor:pointer}
.blank.over,.blank.target{border-color:var(--brand);background:var(--brand-soft);border-style:dashed}
.blank.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.blank.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.blank .fix{margin-left:6px;color:var(--ok);font-weight:700}
.blank .num{font-size:11px;color:var(--muted);font-weight:600}
.bank{background:var(--bg);border-radius:12px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;min-height:62px;border:1.5px dashed transparent}
.bank.over{border-color:var(--brand)}
.word{background:var(--chip);color:var(--chip-ink);border:0;border-radius:8px;padding:6px 14px;font-weight:600;cursor:grab;user-select:none;transition:transform .12s}
.word:hover{transform:translateY(-2px)}
.word.sel{outline:3px solid var(--brand);outline-offset:2px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:0}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:15px}
.btn-primary{background:var(--brand);color:#fff}
.btn-ghost{background:var(--brand-soft);color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Warm-up */
.hero{padding:30px 22px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
.hero>*{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--coral);margin:0 0 6px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:700}
.lead{color:var(--muted);margin:12px 0 0;max-width:60ch}
.qs{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.q{background:var(--bg);border-radius:12px;padding:14px 16px;display:flex;gap:12px}
.q b{font-family:var(--font-display);color:var(--brand);font-size:18px;line-height:1.4}
.q textarea{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical;min-height:40px}
.about{background:var(--brand-soft);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.about p{margin:0}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* Results */
.score{display:flex;align-items:center;gap:20px;padding:22px;flex-wrap:wrap}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:26px;flex:none}
.exp{display:flex;flex-direction:column;gap:14px}
.exp-item{border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.exp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.ctx{font-size:14px;color:var(--muted);margin:0}
.ctx mark{background:var(--chip);color:var(--chip-ink);padding:1px 6px;border-radius:5px;font-weight:700}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0}
.step-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.step.g .step-label{color:var(--brand)}.step.v .step-label{color:var(--coral)}
.step p{margin:0 0 6px;font-size:14px}.step p:last-child{margin:0}
.elim{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.elim span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.elim span.out{text-decoration:line-through;color:var(--muted)}
.elim span.in{border-color:var(--ok);color:var(--ok);font-weight:700}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.v-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.v-term{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--brand)}
.v-type{font-size:12px;color:var(--muted)}
.v-mean{font-weight:600}
.v-ex{font-size:13px;color:var(--muted);font-style:italic}
.section-title{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.section-title span{color:var(--muted);font-size:13px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,16,50,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal-box{background:var(--surface);border-radius:16px;padding:20px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px}
.t-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;width:100%}

footer{text-align:center;padding-block:10px 30px}
.sign{font-family:var(--font-sign);font-style:italic;font-weight:300;font-size:15px;color:var(--muted);letter-spacing:.02em}
.sign b{font-weight:400;color:var(--brand)}

/* ---- hihi skin ---- */
.topbar{border-top:6px solid var(--brand);background:var(--bg)}
body::before{background:var(--brand)}
.logo{font-family:var(--font-display);font-weight:800;font-size:20px;white-space:nowrap;letter-spacing:-.04em;display:flex;align-items:center;gap:7px;color:var(--ink)}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--brand);display:inline-block}
.timer{background:var(--hl);color:var(--hl-ink)}
.timer.warn{background:var(--bad-soft);color:var(--bad)}
.qlist-btn{background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 20px;min-height:44px}
.card{border-radius:24px}
.card-head{padding:16px 22px}
.code{background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px}
.mark{border-radius:999px;padding:6px 14px;background:var(--surface)}
.mark[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.card-body{padding:26px 22px 30px}
.blank{border-radius:10px}
.bank{border-radius:18px;background:var(--sage)}
.word{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand);border-radius:999px;padding:6px 16px}
.word.sel{background:var(--hl);color:var(--hl-ink);border-color:var(--hl);outline:none}
.btn{border-radius:999px;padding:14px 28px;min-height:50px}
.btn-primary{background:var(--brand);color:var(--bg)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.eyebrow{color:var(--brand);background:var(--brand-soft);display:inline-block;padding:6px 12px;border-radius:999px;letter-spacing:.08em}
h1{letter-spacing:-.035em;line-height:1}
h1 .hl{background:var(--hl);color:var(--hl-ink);padding:0 10px;border-radius:12px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
h2{letter-spacing:-.03em}
.hero{padding:40px 32px}
.q{border-radius:18px;background:var(--sage)}
.q:nth-child(2){background:var(--hl);color:var(--hl-ink)}
.q:nth-child(2) b{color:var(--hl-ink)}
.q:nth-child(3){background:var(--lilac);color:var(--lilac-ink)}
.q:nth-child(3) b{color:var(--lilac-ink)}
.q textarea{border-radius:12px}
.about{background:var(--dark);color:var(--dark-ink);border-radius:24px;padding:24px}
.about .eyebrow{background:transparent;color:var(--hl);padding:0}
.pill{border-radius:999px;padding:6px 12px}
.score{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.score .eyebrow{background:transparent;color:var(--hl);padding:0}
.score .hint{color:var(--dark-muted)}
.score .btn-ghost{color:var(--dark-ink);border-color:var(--dark-ink)}
.score .btn-primary{background:var(--hl);color:var(--hl-ink)}
.ring{color:var(--ink)}
.exp-item{border-radius:24px;padding:22px}
.step{border-radius:18px}
.step.g{background:var(--sage)}.step.v{background:var(--coral-soft)}
.step.g .step-label{color:var(--brand)}.step.v .step-label{color:var(--coral)}
.ctx mark{background:var(--hl);color:var(--hl-ink)}
.v-card{border-radius:24px;padding:20px}
.v-card:nth-child(3n+1){background:var(--sage);border-color:transparent}
.v-card:nth-child(3n+2){background:var(--hl);border-color:transparent;color:var(--hl-ink)}
.v-card:nth-child(3n+2) .v-term,.v-card:nth-child(3n+2) .v-type,.v-card:nth-child(3n+2) .v-ex{color:var(--hl-ink)}
.v-card:nth-child(3n){background:var(--lilac);border-color:transparent;color:var(--lilac-ink)}
.v-card:nth-child(3n) .v-term,.v-card:nth-child(3n) .v-type,.v-card:nth-child(3n) .v-ex{color:var(--lilac-ink)}
.leadin{display:flex;gap:16px;align-items:flex-start;background:var(--sage);border-radius:20px;padding:14px 18px;font-size:14px;line-height:1.55}
.leadin-tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--hl);color:var(--hl-ink);padding:4px 10px;border-radius:999px;margin-top:1px}
.leadin-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.leadin-qs{margin:0;padding-left:18px;font-style:italic;color:var(--ink)}
.leadin-intro{margin:0;color:var(--muted)}
@media (max-width:560px){.leadin{flex-direction:column;gap:8px}}
.modal-box{border-radius:24px}
.t-item{border-radius:16px}
footer{border-top:1px solid var(--line);padding-block:26px 34px}
.sign b{color:var(--ink)}

/* ---- Bright & colourful skin (white page, always light) ---- */
:root{color-scheme:light;
  --pink:#FFD9E4; --pink-ink:#8A1D45; --sky:#D3EAFF; --sky-ink:#11487D;
  --peach:#FFE2C9; --peach-ink:#8A3F0C; --mint:#CFF3DE; --mint-ink:#11613A;
  --sun:#FFE88A; --sun-ink:#5E4700; --grape:#E6DEFF; --grape-ink:#46309A;
  --green:#1F8A57; --green-dk:#156B42;}
body{background:#FFFFFF;
  background-image:
    radial-gradient(420px 320px at 0% 0%, rgba(255,232,138,.45), transparent 70%),
    radial-gradient(460px 340px at 100% 12%, rgba(255,217,228,.55), transparent 70%),
    radial-gradient(520px 360px at 8% 92%, rgba(207,243,222,.55), transparent 70%),
    radial-gradient(420px 320px at 96% 96%, rgba(211,234,255,.6), transparent 70%);
  background-attachment:fixed}
.topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-top:0;position:sticky}
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;
  background:linear-gradient(90deg,var(--green) 0 25%,#F6C93B 25% 50%,#FF7FA3 50% 75%,#4DA3F5 75%)}
body::before{background:var(--green)}
.logo i{background:var(--green);box-shadow:10px 0 0 #F6C93B,20px 0 0 #FF7FA3;margin-right:22px}
.timer{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 #E7C84A}
.timer.warn{background:var(--pink);color:var(--pink-ink);box-shadow:0 3px 0 #F4A9BF}
.qlist-btn{background:var(--grape-ink);color:#fff;box-shadow:0 3px 0 #2E1F70}

.leadin{background:var(--sun);border:2px solid #F3D45A;border-radius:22px;padding:16px 20px;position:relative;color:var(--sun-ink)}
.leadin-tag{background:var(--sun-ink);color:var(--sun)}
.leadin-qs{color:var(--sun-ink);font-weight:500}
.leadin-intro{color:#6E5A12}

.card{border:2px solid #EFEDF7;box-shadow:0 10px 30px rgba(70,48,154,.08)}
.card-head{background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:22px 22px 0 0;border-bottom:0}
.code{background:var(--grape-ink);color:#fff}
.mark{background:#fff;border-color:transparent}
.mark[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink)}
.instr{color:var(--grape-ink)}
.passage{color:var(--ink)}
.blank{border:2px dashed #B9B2E0;background:#FAF9FF;height:32px}
.blank.over,.blank.target{border-color:var(--green);background:var(--mint)}
.bank{background:#F7F6FF;border:2px dashed #DCD6F5}
.bank.over{border-color:var(--green)}
.word{border:0;font-weight:700;padding:8px 18px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.word:hover{transform:translateY(-2px) rotate(-1.5deg)}
.word.sel{outline:3px solid var(--grape-ink);outline-offset:2px}
.c0{background:var(--mint);color:var(--mint-ink)} .c1{background:var(--sky);color:var(--sky-ink)}
.c2{background:var(--pink);color:var(--pink-ink)} .c3{background:var(--sun);color:var(--sun-ink)}
.c4{background:var(--grape);color:var(--grape-ink)} .c5{background:var(--peach);color:var(--peach-ink)}
.blank.filled{border-style:solid;border-color:transparent}
.word.sel.c3,.word.sel{background:inherit}
.word.sel.c0{background:var(--mint)}.word.sel.c1{background:var(--sky)}.word.sel.c2{background:var(--pink)}
.word.sel.c3{background:var(--sun)}.word.sel.c4{background:var(--grape)}.word.sel.c5{background:var(--peach)}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dk)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk)}
.btn-ghost{background:#fff;color:var(--grape-ink);border:2px solid var(--grape-ink)}

.score{background:linear-gradient(120deg,var(--green) 0%,#2BA36B 55%,#4DA3F5 100%);color:#fff;border:0}
.score .eyebrow{color:var(--sun)}
.score .hint{color:#E4F6EC}
.score .btn-ghost{background:transparent;color:#fff;border-color:#fff}
.score .btn-primary{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 #D9B83A}
.ring{background:conic-gradient(var(--sun) var(--deg,0deg),rgba(255,255,255,.25) 0)!important}
.ring .ring{background:#fff!important;color:var(--green)}
.blank.ok{background:var(--mint);border:2px solid var(--green);color:var(--mint-ink)}
.blank.bad{background:var(--pink);border:2px solid #E0577E;color:var(--pink-ink)}
.exp-item{border:2px solid #EFEDF7;box-shadow:0 6px 18px rgba(70,48,154,.06)}
.exp-item h3{color:var(--grape-ink)}
.step.g{background:var(--sky)} .step.g .step-label{color:var(--sky-ink)}
.step.v{background:var(--peach)} .step.v .step-label{color:var(--peach-ink)}
.ctx mark{background:var(--sun);color:var(--sun-ink)}
.badge.ok{background:var(--mint);color:var(--mint-ink)}.badge.bad{background:var(--pink);color:var(--pink-ink)}
.section-title h2{color:var(--grape-ink)}
.v-card{border:0!important;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.v-card:nth-child(5n+1){background:var(--mint);color:var(--mint-ink)}
.v-card:nth-child(5n+2){background:var(--sun);color:var(--sun-ink)}
.v-card:nth-child(5n+3){background:var(--pink);color:var(--pink-ink)}
.v-card:nth-child(5n+4){background:var(--sky);color:var(--sky-ink)}
.v-card:nth-child(5n){background:var(--grape);color:var(--grape-ink)}
.v-card .v-term,.v-card .v-type,.v-card .v-ex{color:inherit!important}
.v-card .v-type,.v-card .v-ex{opacity:.8}
footer{border-top:0}
.sign b{color:var(--grape-ink)}

/* ---- CTA + matching ---- */
.cta{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:24px 26px;border-radius:24px;
  background:linear-gradient(120deg,var(--grape) 0%,var(--pink) 55%,var(--sun) 100%);color:var(--grape-ink)}
.cta-text{min-width:0;display:flex;flex-direction:column;gap:6px}
.cta p{margin:0}
.cta .eyebrow{background:#fff;color:var(--grape-ink)}
.cta .btn-primary{background:var(--grape-ink);box-shadow:0 4px 0 #2E1F70}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 24px;
  background:linear-gradient(90deg,var(--mint),var(--sky));border:0}
.p-head h2{color:var(--grape-ink)}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
.m-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.m-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;width:100%;min-height:48px;padding:10px 14px;
  border-radius:16px;border:2px solid #E3DFF5;background:#fff;font-weight:600;color:var(--ink);transition:transform .12s}
.m-item:hover{transform:translateY(-1px);border-color:#B9B2E0}
.m-item.linked{border-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.m-item.pick{border-color:var(--grape-ink);background:var(--grape);color:var(--grape-ink);border-style:dashed}
.m-item.right{outline:3px solid var(--green);outline-offset:2px}
.m-item.wrong{outline:3px solid #E0577E;outline-offset:2px}
.m-num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.75);color:var(--grape-ink)}
.m-item:not(.linked):not(.pick) .m-num{background:#F1EFFA}
.m-fix{flex-basis:100%;font-size:12px;font-weight:700;color:var(--pink-ink)}
@media (max-width:560px){.m-grid{gap:10px 12px}.m-item{font-size:13px;padding:8px 10px}.m-num{width:22px;height:22px}}

/* ---- Trang chủ ---- */
a.logo{text-decoration:none}
.home-hero{padding:18px 4px 6px;display:flex;flex-direction:column;gap:10px}
.home-hero h1{font-size:clamp(30px,5vw,52px)}
.home-hero .eyebrow{align-self:flex-start}
.h-group{display:flex;flex-direction:column;gap:14px}
.h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.h-card{display:flex;flex-direction:column;gap:4px;padding:20px;border-radius:24px;text-decoration:none;
  box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .15s}
.h-card:hover{transform:translateY(-3px) rotate(-.6deg)}
.h-code{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.h-type{font-size:13px;font-weight:600;opacity:.85}
.h-topic{font-size:14px}
.h-meta{font-size:12px;opacity:.75;margin-top:6px}
.h-go{margin-top:10px;align-self:flex-start;background:rgba(255,255,255,.75);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}

/* ---- Topics, levels, question list ---- */
:root{--money:#FFE88A;--money-ink:#5E4700;--edu:#D3EAFF;--edu-ink:#11487D;--env:#CFF3DE;--env-ink:#11613A;--oth:#FFD9E4;--oth-ink:#8A1D45}
.cat-money{background:var(--money);color:var(--money-ink)} .cat-edu{background:var(--edu);color:var(--edu-ink)}
.cat-env{background:var(--env);color:var(--env-ink)} .cat-oth{background:var(--oth);color:var(--oth-ink)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.cat-card{display:flex;flex-direction:column;gap:8px;padding:26px 24px;border-radius:28px;text-decoration:none;min-height:170px;
  box-shadow:0 5px 0 rgba(0,0,0,.09);transition:transform .15s}
.cat-card:hover{transform:translateY(-4px) rotate(-.6deg)}
.cat-ico{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.7);display:grid;place-items:center;flex:none}
.cat-name{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.03em}
.cat-go{margin-top:auto}
.cat-desc{font-size:14px;opacity:.85}
.cat-lv{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.cat-lv span{font-size:12px;font-weight:600;background:rgba(255,255,255,.6);padding:3px 9px;border-radius:999px}
.cat-go{font-weight:700;font-size:14px}
.topic-head{display:flex;gap:18px;align-items:center;padding:26px;border-radius:28px}
.topic-head .eyebrow{background:rgba(255,255,255,.7);color:inherit}
.topic-head .lead{color:inherit;opacity:.85}
.lv-tabs{display:flex;gap:10px;flex-wrap:wrap}
.lv-tab{display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:700;
  background:#fff;border:2px solid var(--line);color:var(--ink)}
.lv-tab span{font-size:12px;background:#F1EFFA;border-radius:999px;padding:1px 8px}
.lv-tab.on.lv-easy{background:#CFF3DE;border-color:#1F8A57;color:#11613A}
.lv-tab.on.lv-medium{background:#FFE2C9;border-color:#D9822B;color:#8A3F0C}
.lv-tab.on.lv-hard{background:#FFD9E4;border-color:#D84A74;color:#8A1D45}
.q-list{display:flex;flex-direction:column;gap:10px}
.q-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:16px 20px;border-radius:20px;
  background:#fff;border:2px solid #EFEDF7;text-decoration:none;color:var(--ink);transition:transform .12s}
.q-row:hover{transform:translateX(4px);border-color:#B9B2E0}
.q-code{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--grape-ink)}
.q-topic{font-size:14px;color:var(--muted);min-width:0}
.q-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.tag.bm{background:var(--sun);color:var(--sun-ink)} .tag.dn{background:var(--mint);color:var(--mint-ink)}
.q-go{font-weight:700;font-size:14px;color:var(--green)}
.empty{padding:28px;border-radius:20px;border:2px dashed #DCD6F5;text-align:center;color:var(--muted);background:#fff}
.lvl-pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
.lvl-pill.lv-easy{background:#CFF3DE;color:#11613A}.lvl-pill.lv-medium{background:#FFE2C9;color:#8A3F0C}.lvl-pill.lv-hard{background:#FFD9E4;color:#8A1D45}
.with-side{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.side-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.qlist{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:#fff;border:2px solid #EFEDF7;border-radius:24px;
  box-shadow:0 10px 30px rgba(70,48,154,.08);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
.ql-head{display:flex;align-items:center;gap:8px;padding:14px 16px}
.ql-head b{font-family:var(--font-display);font-size:16px}
.ql-head span{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.7);padding:3px 10px;border-radius:999px}
.ql-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px 10px 6px}
.ql-tab{border:0;border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;background:#F4F2FC;color:var(--muted)}
.ql-tab small{opacity:.7}
.ql-tab.on{background:var(--grape-ink);color:#fff}
.ql-items{display:flex;flex-direction:column;gap:4px;padding:4px 10px 10px;overflow:auto}
.ql-item{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.ql-item:hover{background:#F4F2FC}
.ql-item.now{background:var(--grape);color:var(--grape-ink)}
.ql-st{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.ql-sub{padding:10px 20px 2px;border-top:2px solid #F1EFFA;font-size:13px;font-weight:700;color:var(--sun-ink)}
.ql-empty{margin:4px 2px;font-size:13px;color:var(--muted)}
.ql-back{display:block;padding:12px 18px;border-top:2px solid #F1EFFA;font-size:13px;font-weight:700;color:var(--grape-ink);text-decoration:none}
@media (max-width:1000px){.with-side{grid-template-columns:1fr}.qlist{position:static;max-height:none}}
@media (max-width:560px){.q-row{grid-template-columns:auto 1fr;}.q-tags,.q-go{grid-column:1/-1}.topic-head{flex-direction:column;align-items:flex-start}}

/* ---- Question list: ẩn mặc định, trượt ra từ bên phải ---- */
.with-side{display:block}
.qlist{position:fixed;top:calc(env(safe-area-inset-top,0px) + 96px);right:calc(14px + env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 32px));
  max-height:calc(100vh - 120px);z-index:8;transform:translateX(calc(100% + 40px));opacity:0;visibility:hidden;
  transition:transform .25s ease,opacity .25s ease,visibility .25s}
.qlist.open{transform:none;opacity:1;visibility:visible;box-shadow:0 18px 50px rgba(46,31,112,.22)}
.ql-close{margin-left:6px;border:0;background:rgba(255,255,255,.75);width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;font-weight:700;color:inherit}
.ql-toggle{position:fixed;right:env(safe-area-inset-right,0px);top:50%;transform:translateY(-50%);z-index:7;border:0;
  background:var(--grape-ink);color:#fff;border-radius:16px 0 0 16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:-3px 4px 14px rgba(46,31,112,.25)}
.ql-toggle:hover{padding-right:12px}
.ql-toggle.hide{display:none}
.ql-arrow{font-size:22px;line-height:1;font-weight:700}
.ql-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:700;letter-spacing:.04em}
@media (max-width:1000px){.qlist{position:fixed;max-height:calc(100vh - 120px)}}

@media (max-width:760px){
  .logo{display:none}
  .hero{grid-template-columns:1fr;padding:22px 16px}
  .steps{grid-template-columns:1fr}
  .blank{min-width:110px}
  .sep,.title span.long{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#" id="homeLink"><i aria-hidden="true"></i>Chau's Reading Lab</a>
    <div class="sep"></div>
    <button class="back" id="backBtn" type="button" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Back
    </button>
    <div class="sep"></div>
    <div class="title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span id="taskType">Drag and Drop – Fill in the Blanks</span>
    </div>
    <div class="timer" id="timer" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
      <span id="timeTxt">05:00</span>
    </div>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<footer><span class="sign">Designed by <b>Le Bao Chau</b></span></footer>


<script src="tests.js"></script>
<script>

/* ================== APP ================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const TESTS = window.TESTS || [];
let cur = 0, state = {}, selected = null, timerId = null, left = 0, phase = "warm";
/* Danh mục chủ đề + level (thứ tự hiển thị) */
const CATS=[
  {id:"money",name:"Money",cls:"cat-money",desc:"Business, finance, work and the economy",
   icon:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.8 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v11"/>'},
  {id:"education",name:"Education",cls:"cat-edu",desc:"Schools, learning, research and young people",
   icon:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5M22 9v6"/>'},
  {id:"environment",name:"Environment",cls:"cat-env",desc:"Nature, climate, energy and cities",
   icon:'<path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19l7-7"/>'},
  {id:"others",name:"Others",cls:"cat-oth",desc:"Science, health, culture and everything else",
   icon:'<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>'}
];
const LEVELS=["Easy","Medium","Hard"];
function catOf(t){let k=(t.category||"Others").toLowerCase(); if(k==="business"||k==="finance") k="money"; return CATS.find(c=>c.id===k||c.name.toLowerCase()===k)||CATS[3]}
function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"{}"); localStorage.setItem(k,JSON.stringify(v)) }catch(e){ return {} }}
let marked=store("crl-bookmarks")||{}, doneMap=store("crl-done")||{};
let topicLevel={}, qlLevel=null, qlOpen=false;
function visible(){return TESTS.map((t,i)=>({t,i})).filter(x=>!x.t.hidden)}

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* Lead-in nhỏ phía trên task: câu hỏi gợi mở + giới thiệu ngắn, không cần trả lời */
function leadIn(t){
  return `<section class="leadin" aria-label="Lead-in">
    <span class="leadin-tag">Khởi động (Lead-in)</span>
    <div class="leadin-body">
      <ul class="leadin-qs">${t.warmup.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>
      <p class="leadin-intro">${esc(t.warmup.intro)}</p>
    </div>
  </section>`;
}

function renderWarm(){ startTest(); }

/* ---------- Trang chủ ---------- */
function catIcon(c,size){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${c.icon}</svg>`}
function testRow(t){
  const d=doneMap[t.code];
  return `<a class="q-row" href="#${encodeURIComponent(t.code)}">
    <span class="q-code">${esc(t.code)}</span>
    <span class="q-topic">${esc(t.topic||"")}</span>
    <span class="q-tags">${marked[t.code]?'<span class="tag bm">★ Bookmarked</span>':""}${d?`<span class="tag dn">✓ ${d}</span>`:""}</span>
    <span class="q-go">Start →</span></a>`;
}
function renderHome(){
  stopTimer(); phase="home"; $("#timer").hidden=true; $("#taskType").textContent="Reading Library";
  const list=visible(), bm=list.filter(x=>marked[x.t.code]);
  app.innerHTML=`
  <section class="home-hero">
    <p class="eyebrow">Chau's Reading Lab</p>
    <h1>Everyday reading for <span class="hl">PTE Learners</span></h1>
    <p class="lead">Choose a topic, then pick your level. Each task takes ${TESTS[0]?TESTS[0].minutes:5} minutes, and when you finish you get answer explanations and vocabulary practice.</p>
  </section>
  <div class="cat-grid">${CATS.map(c=>{const items=list.filter(x=>catOf(x.t)===c);
    return `<a class="cat-card ${c.cls}" href="#${c.id}">
      <span class="cat-name">${c.name}</span>
      <span class="cat-desc">${c.desc}</span>
      <span class="cat-go">${items.length} ${items.length===1?"reading":"readings"} →</span></a>`}).join("")}</div>
  ${bm.length?`<section class="h-group"><div class="section-title"><h2>Your bookmarks</h2><span>${bm.length}</span></div>
    <div class="q-list">${bm.map(x=>testRow(x.t)).join("")}</div></section>`:""}`;
  window.scrollTo({top:0});
}
function renderTopic(c,lv){
  stopTimer(); phase="topic"; $("#timer").hidden=true; $("#taskType").textContent=c.name;
  const items=visible().filter(x=>catOf(x.t)===c);
  if(!lv){ lv=topicLevel[c.id]||LEVELS.find(L=>items.some(x=>(x.t.level||"Easy")===L))||"Easy" }
  topicLevel[c.id]=lv;
  const lvItems=items.filter(x=>(x.t.level||"Easy")===lv);
  app.innerHTML=`
  <section class="topic-head ${c.cls}">
    <div style="min-width:0"><p class="eyebrow">Topic</p><h1>${c.name}</h1><p class="lead" style="margin:6px 0 0">${c.desc}</p></div>
  </section>
  <div class="lv-tabs" role="tablist">${LEVELS.map(L=>{const n=items.filter(x=>(x.t.level||"Easy")===L).length;
    return `<a role="tab" aria-selected="${L===lv}" class="lv-tab lv-${L.toLowerCase()} ${L===lv?"on":""}" href="#${c.id}-${L.toLowerCase()}">${L}<span>${n}</span></a>`}).join("")}</div>
  ${lvItems.length?`<div class="q-list">${lvItems.map(x=>testRow(x.t)).join("")}</div>`
    :`<div class="empty">No ${lv.toLowerCase()} readings in ${c.name} yet. Try another level.</div>`}`;
  window.scrollTo({top:0});
}

/* ---------- Question list bên phải ---------- */
function sidebarHTML(){
  const t=TESTS[cur], c=catOf(t), items=visible().filter(x=>catOf(x.t)===c);
  const lv=qlLevel||t.level||"Easy";
  const lvItems=items.filter(x=>(x.t.level||"Easy")===lv);
  const bm=visible().filter(x=>marked[x.t.code]);
  const item=x=>{const d=doneMap[x.t.code];
    return `<a class="ql-item ${x.i===cur?"now":""}" href="#${encodeURIComponent(x.t.code)}">
      <span>${esc(x.t.code)}</span><span class="ql-st">${marked[x.t.code]?"★":""}${d?` ✓${d}`:""}</span></a>`};
  return `<div class="ql-head ${c.cls}"><b>Question list</b><span>${c.name}</span><button type="button" class="ql-close" id="qlClose" aria-label="Hide question list">›</button></div>
    <div class="ql-tabs">${LEVELS.map(L=>`<button type="button" class="ql-tab ${L===lv?"on":""}" data-lv="${L}">${L} <small>${items.filter(x=>(x.t.level||"Easy")===L).length}</small></button>`).join("")}</div>
    <div class="ql-items">${lvItems.length?lvItems.map(item).join(""):`<p class="ql-empty">No readings at this level yet.</p>`}</div>
    <div class="ql-sub">★ Bookmarked <small>${bm.length}</small></div>
    <div class="ql-items">${bm.length?bm.map(x=>`<a class="ql-item ${x.i===cur?"now":""}" href="#${encodeURIComponent(x.t.code)}"><span>${esc(x.t.code)}</span><span class="ql-st">${catOf(x.t).name} · ${x.t.level||"Easy"}</span></a>`).join(""):`<p class="ql-empty">Bookmark a question to find it here later.</p>`}</div>
    <a class="ql-back" href="#${c.id}">← All ${c.name} readings</a>`;
}
function attachSidebar(){
  const kids=[...app.children];
  const wrap=document.createElement("div"); wrap.className="with-side";
  const main=document.createElement("div"); main.className="side-main";
  kids.forEach(k=>main.appendChild(k));
  const aside=document.createElement("aside"); aside.className="qlist"+(qlOpen?" open":""); aside.id="qlist"; aside.setAttribute("aria-label","Question list");
  aside.innerHTML=sidebarHTML();
  const tab=document.createElement("button"); tab.type="button"; tab.className="ql-toggle"+(qlOpen?" hide":""); tab.id="qlToggle";
  tab.setAttribute("aria-label","Show question list"); tab.innerHTML='<span class="ql-arrow">‹</span><span class="ql-label">Question list</span>';
  wrap.append(main,aside,tab); app.appendChild(wrap); bindSidebar();
}
function setQl(open){qlOpen=open; const a=$("#qlist"), t=$("#qlToggle"); if(a) a.classList.toggle("open",open); if(t) t.classList.toggle("hide",open)}
function bindSidebar(){
  const t=$("#qlToggle"), c=$("#qlClose"); if(t) t.onclick=()=>setQl(true); if(c) c.onclick=()=>setQl(false);
  document.querySelectorAll(".ql-tab").forEach(b=>b.onclick=()=>{qlLevel=b.dataset.lv; const a=$("#qlist"); a.innerHTML=sidebarHTML(); bindSidebar()});
}
function refreshSidebar(){const a=$("#qlist"); if(a){a.innerHTML=sidebarHTML(); bindSidebar()}}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const i=TESTS.findIndex(t=>t.code===h);
  if(i>-1){cur=i; qlLevel=null; startTest(); window.scrollTo({top:0}); return}
  const [cid,lv]=h.toLowerCase().split("-");
  const c=CATS.find(x=>x.id===cid);
  if(c){ renderTopic(c, LEVELS.find(L=>L.toLowerCase()===lv)); return }
  renderHome();
}

function startTest(){
  stopTimer();
  const t=TESTS[cur]; phase="test"; state={}; selected=null; $("#taskType").textContent=t.type;
  Object.keys(t.answers).forEach(k=>state[k]=null);
  renderTest(); left=t.minutes*60; $("#timer").hidden=false; tick(); timerId=setInterval(tick,1000);
}

function tick(){
  const m=String(Math.floor(left/60)).padStart(2,"0"), s=String(left%60).padStart(2,"0");
  $("#timeTxt").textContent=`${m}:${s}`; $("#timer").classList.toggle("warn",left<=60);
  if(left<=0){stopTimer(); submit(true); return} left--;
}
function stopTimer(){clearInterval(timerId); timerId=null}

function usedWords(){return Object.values(state).filter(Boolean)}

function renderTest(){
  const t=TESTS[cur];
  const pass=t.passage.map(p=>typeof p==="string"?esc(p):
    `<span class="blank ${state[p.b]?"filled c"+(t.words.indexOf(state[p.b])%6):""}" tabindex="0" role="button" data-b="${p.b}" aria-label="Blank ${p.b}">${state[p.b]?esc(state[p.b]):""}</span>`).join(" ");
  const avail=[...t.words]; usedWords().forEach(w=>{const i=avail.indexOf(w); if(i>-1)avail.splice(i,1)});
  app.innerHTML=`${leadIn(t)}
  <section class="card">
    <div class="card-head">
      <span class="code">${t.code}</span>
      <span class="lvl-pill lv-${(t.level||"Easy").toLowerCase()}">${catOf(t).name} · ${t.level||"Easy"}</span>
      <button class="mark" id="markBtn" type="button" aria-pressed="${!!marked[t.code]}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="${marked[t.code]?"currentColor":"none"}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        ${marked[t.code]?"Bookmarked":"Bookmark"}</button>
    </div>
    <div class="card-body">
      <p class="instr">In the text below some words are missing. Drag words from the box below to the appropriate place in the text. To undo an answer choice, drag the word back to the box below the text.</p>
      <p class="passage">${pass}</p>
      <div class="bank" id="bank">${avail.map(w=>`<button class="word c${t.words.indexOf(w)%6} ${selected===w?"sel":""}" draggable="true" data-w="${esc(w)}" type="button">${esc(w)}</button>`).join("")}</div>
      <div class="actions">
        <p class="hint">Kéo thả từ vào ô trống, hoặc chạm vào từ rồi chạm vào ô. Chạm vào ô đã điền để trả từ về hộp.</p>
        <button class="btn btn-primary" id="submitBtn" type="button">Submit</button>
      </div>
    </div>
  </section>`;
  attachSidebar();
  bindTest();
}

function place(b,w){
  // nếu từ đang ở ô khác thì gỡ ra
  for(const k in state) if(state[k]===w){state[k]=null;break}
  state[b]=w; selected=null; renderTest();
}
function bindTest(){
  const t=TESTS[cur];
  $("#markBtn").onclick=()=>{ if(marked[t.code]) delete marked[t.code]; else marked[t.code]=1; store("crl-bookmarks",marked); renderTest()};
  $("#submitBtn").onclick=()=>submit(false);
  document.querySelectorAll(".word").forEach(el=>{
    el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",JSON.stringify({w:el.dataset.w}))});
    el.onclick=()=>{selected = selected===el.dataset.w?null:el.dataset.w; renderTest()};
  });
  document.querySelectorAll(".blank").forEach(el=>{
    const b=el.dataset.b;
    if(state[b]){ el.draggable=true;
      el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",JSON.stringify({w:state[b],from:b}))); }
    el.addEventListener("dragover",e=>{e.preventDefault(); el.classList.add("over")});
    el.addEventListener("dragleave",()=>el.classList.remove("over"));
    el.addEventListener("drop",e=>{e.preventDefault(); const d=JSON.parse(e.dataTransfer.getData("text/plain")||"{}");
      if(!d.w) return; const prev=state[b]; if(d.from){state[d.from]=prev} state[b]=null; place(b,d.w)});
    const act=()=>{ if(selected){place(b,selected)} else if(state[b]){state[b]=null; renderTest()} };
    el.onclick=act; el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}};
    if(selected) el.classList.add("target");
  });
  const bank=$("#bank");
  bank.addEventListener("dragover",e=>{e.preventDefault(); bank.classList.add("over")});
  bank.addEventListener("dragleave",()=>bank.classList.remove("over"));
  bank.addEventListener("drop",e=>{e.preventDefault(); const d=JSON.parse(e.dataTransfer.getData("text/plain")||"{}");
    if(d.from){state[d.from]=null} renderTest()});
}

let lastAuto=false, lastTime="";
function nextIdx(){const t=TESTS[cur]; return TESTS.findIndex((x,i)=>i>cur&&!x.hidden&&catOf(x)===catOf(t)&&(x.level||"Easy")===(t.level||"Easy"))}
function submit(auto){
  stopTimer(); $("#timer").classList.remove("warn");
  lastAuto=auto; lastTime=$("#timeTxt").textContent;
  { const t=TESTS[cur], keys=Object.keys(t.answers); doneMap[t.code]=keys.filter(k=>state[k]===t.answers[k]).length+"/"+keys.length; store("crl-done",doneMap) }
  practice={};
  renderResults();
}
function renderResults(){
  phase="done";
  const auto=lastAuto;
  const t=TESTS[cur], keys=Object.keys(t.answers);
  const correct=keys.filter(k=>state[k]===t.answers[k]).length, pct=Math.round(correct/keys.length*100);
  const pass=t.passage.map(p=>{ if(typeof p==="string") return esc(p);
    const ok=state[p.b]===t.answers[p.b];
    return `<span class="blank ${ok?"ok":"bad"}"><span class="num">${p.b}.&nbsp;</span>${state[p.b]?esc(state[p.b]):"—"}${ok?"":`<span class="fix">→ ${t.answers[p.b]}</span>`}</span>`}).join(" ");
  const msg = pct===100?"Perfect! Bạn đọc ngữ cảnh rất chắc.":pct>=50?"Khá tốt! Xem lại phần giải thích để chắc hơn nhé.":"Không sao, đọc kỹ 2 bước giải thích bên dưới nhé.";
  app.innerHTML=`
  <section class="card score">
    <div class="ring" style="--deg:${pct*3.6}deg">
      <div class="ring" style="width:76px;height:76px;background:var(--surface)">${correct}/${keys.length}</div></div>
    <div style="flex:1;min-width:200px">
      <p class="eyebrow">${t.code} · ${auto?"Hết giờ, bài đã tự nộp":"Đã nộp bài"}</p>
      <h2>${msg}</h2>
      <p class="hint" style="margin-top:4px">Thời gian còn lại: ${lastTime}</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" id="retry" type="button">Làm lại</button>
      ${nextIdx()>-1?`<button class="btn btn-primary" id="next" type="button">Bài tiếp →</button>`:""}
    </div>
  </section>
  <section class="card"><div class="card-body"><h3>Your answers</h3><p class="passage">${pass}</p></div></section>

  <div class="section-title"><h2>Giải thích đáp án</h2><span>Bước 1 · Ngữ pháp → Bước 2 · Từ vựng</span></div>
  <div class="exp">${keys.map(k=>{const e=t.explain[k], ok=state[k]===t.answers[k];
    const ctx=esc(e.ctx).replace("___",`<mark>${t.answers[k]}</mark>`);
    return `<article class="exp-item">
      <div class="exp-top"><h3>Ô ${k}: ${t.answers[k]}</h3>
        <span class="badge ${ok?"ok":"bad"}">${ok?"Đúng":`Bạn chọn: ${state[k]||"bỏ trống"}`}</span></div>
      <p class="ctx">${ctx}</p>
      <div class="steps">
        <div class="step g"><div class="step-label">Step 1 · Grammar: thu hẹp đáp án</div>
          ${e.grammar.map(x=>`<p>${x}</p>`).join("")}
          <div class="elim">${t.words.map(w=>`<span class="${w===t.answers[k]?"in":e.keep.includes(w)?"":"out"}">${w}</span>`).join("")}</div>
        </div>
        <div class="step v"><div class="step-label">Step 2 · Vocabulary: chọn từ hợp nghĩa</div>
          ${e.vocab.map(x=>`<p>${x}</p>`).join("")}
        </div>
      </div></article>`}).join("")}</div>

  <div class="section-title"><h2>Từ vựng cần nhớ</h2><span>${t.vocabulary.length} cụm từ</span></div>
  <div class="vocab">${t.vocabulary.map(v=>`<div class="v-card">
    <span class="v-term">${esc(v.term)}</span><span class="v-type">${esc(v.type)}</span>
    <span class="v-mean">${esc(v.mean)}</span><span class="v-ex">${esc(v.ex)}</span></div>`).join("")}</div>

  <section class="cta">
    <div class="cta-text">
      <p class="eyebrow">Next step</p>
      <h2>Ôn lại từ vựng vừa học</h2>
      <p>2 bài nối nhanh: <b>Bài 1</b> nối collocation, <b>Bài 2</b> nối từ với nghĩa.</p>
    </div>
    <button class="btn btn-primary" id="goPractice" type="button">Luyện từ vựng →</button>
  </section>`;
  attachSidebar();
  $("#goPractice").onclick=()=>renderPractice(true);
  $("#retry").onclick=renderWarm;
  if($("#next")) $("#next").onclick=()=>{location.hash=encodeURIComponent(TESTS[nextIdx()].code)};
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ================== ÔN TỪ VỰNG: BÀI NỐI ================== */
let practice={};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newMatch(pairs){ // pairs: [{a,b}]
  let order=shuffle(pairs.map((_,i)=>i));
  if(order.every((v,i)=>v===i)&&order.length>1) order.push(order.shift());
  return {pairs, right:order, link:{}, pick:null, checked:false};
}
function exercises(){
  const t=TESTS[cur];
  return [
    {key:"col", title:"Bài 1 · Nối collocation", desc:"Nối vế bên trái với vế bên phải để tạo cụm từ đúng như trong bài đọc.", pairs:t.collocations},
    {key:"mean", title:"Bài 2 · Nối nghĩa", desc:"Nối mỗi từ/cụm từ tiếng Anh với nghĩa tiếng Việt phù hợp.", pairs:t.vocabulary.map(v=>({a:v.term,b:v.mean}))}
  ];
}
function renderPractice(scroll){
  phase="practice";
  const ex=exercises();
  ex.forEach(e=>{ if(!practice[e.key]) practice[e.key]=newMatch(e.pairs) });
  app.innerHTML=`
  <section class="card p-head">
    <div><p class="eyebrow">${TESTS[cur].code} · Vocabulary practice</p>
      <h2>Ôn từ vựng</h2>
      <p class="hint" style="margin-top:4px">Chạm vào 1 ô bên trái, rồi chạm vào ô bên phải để nối. Chạm lại vào ô đã nối để gỡ ra.</p></div>
    <button class="btn btn-ghost" id="backRes" type="button">← Xem lại kết quả</button>
  </section>
  ${ex.map(e=>matchHTML(e)).join("")}`;
  attachSidebar();
  $("#backRes").onclick=renderResults;
  ex.forEach(e=>bindMatch(e));
  if(scroll) window.scrollTo({top:0,behavior:"smooth"});
}
function matchHTML(e){
  const m=practice[e.key], n=e.pairs.length;
  const linkedRight={}; Object.entries(m.link).forEach(([l,r])=>linkedRight[r]=+l);
  const score=Object.entries(m.link).filter(([l,r])=>+l===+r).length;
  const leftCls=i=>{let c="m-item"; if(i in m.link) c+=" c"+(i%6)+" linked"; if(m.pick===i) c+=" pick";
    if(m.checked) c+= (m.link[i]==i?" right":" wrong"); return c};
  const rightCls=r=>{let c="m-item"; if(r in linkedRight) c+=" c"+(linkedRight[r]%6)+" linked"; return c};
  return `<section class="card match" id="m-${e.key}">
    <div class="card-head"><span class="code">${e.title}</span>
      ${m.checked?`<span class="badge ${score===n?"ok":"bad"}">Đúng ${score}/${n}</span>`:""}</div>
    <div class="card-body">
      <p class="instr">${e.desc}</p>
      <div class="m-grid">
        <div class="m-col">${e.pairs.map((p,i)=>`<button type="button" class="${leftCls(i)}" data-side="l" data-i="${i}">
          <span class="m-num">${i+1}</span>${esc(p.a)}${m.checked&&m.link[i]!=i?`<span class="m-fix">→ ${esc(p.b)}</span>`:""}</button>`).join("")}</div>
        <div class="m-col">${m.right.map((r,k)=>`<button type="button" class="${rightCls(r)}" data-side="r" data-i="${r}">
          <span class="m-num">${String.fromCharCode(65+k)}</span>${esc(e.pairs[r].b)}</button>`).join("")}</div>
      </div>
      <div class="actions">
        <p class="hint">Đã nối ${Object.keys(m.link).length}/${n}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost" data-act="reset" type="button">Làm lại</button>
          <button class="btn btn-primary" data-act="check" type="button" ${Object.keys(m.link).length<n?"disabled":""}>Kiểm tra</button>
        </div>
      </div>
    </div></section>`;
}
function bindMatch(e){
  const root=document.getElementById("m-"+e.key), m=practice[e.key];
  const redraw=()=>{root.outerHTML=matchHTML(e); bindMatch(e)};
  root.querySelectorAll(".m-item").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(m.checked){m.checked=false}
    if(b.dataset.side==="l"){
      if(i in m.link){delete m.link[i]; m.pick=null}
      else m.pick = m.pick===i?null:i;
    } else {
      const owner=Object.keys(m.link).find(l=>m.link[l]===i);
      if(m.pick!==null){ if(owner!==undefined) delete m.link[owner]; m.link[m.pick]=i; m.pick=null; }
      else if(owner!==undefined){ delete m.link[owner] }
    }
    redraw();
  });
  root.querySelector('[data-act="reset"]').onclick=()=>{practice[e.key]=newMatch(e.pairs); renderPractice(false); document.getElementById("m-"+e.key).scrollIntoView({block:"start",behavior:"smooth"})};
  root.querySelector('[data-act="check"]').onclick=()=>{m.checked=true; m.pick=null; redraw()};
}

$("#backBtn").onclick=()=>{
  if(phase==="practice") return renderResults();
  if(phase==="test"||phase==="done"){ location.hash=catOf(TESTS[cur]).id+"-"+(TESTS[cur].level||"Easy").toLowerCase(); return }
  if(phase==="topic") return goHome();
};
function goHome(){ if(location.hash){ location.hash="" } else renderHome() }
window.addEventListener("hashchange",route);

route();
</script>
